application: "oriva-backend"
listen: ":8080"
is_prod_mode: false

logger:
  level: "debug"

postgres:
  dsn: "postgres://oriva:oriva@localhost:5432/oriva?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: "1h"
  auto_migrate: true

auth:
  jwt_secret: "dev-insecure-secret-change-me"
  access_ttl: "1h"
  bcrypt_cost: 12

mcp:
  enabled: true
  path: "/mcp"
  auth_token: "dev-mcp-token"

app:
  base_url: "http://localhost:5173"
  ai_ws_url: "ws://localhost:8090/ws"

notify:
  transport: "log"
  from: "interviews@oriva.dev"

judge:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""   # set via env ORIVA__JUDGE__OPENROUTER__API_KEY (.env), never here
    model: "openai/gpt-4o-mini"
  # A second, CPU-only Ollama instance (port 11435, GPU hidden) dedicated to
  # judging -- keeps it off the GPU the live conversational model (port
  # 11434) needs for real-time question generation, so per-turn scoring
  # (which runs in parallel with the live call) never contends with it.
  # Bigger model than the conversational one since judging isn't latency-
  # critical: it runs in the background either way.
  ollama:
    base_url: "http://localhost:11435/v1"
    api_key: "ollama"
    model: "qwen2.5:7b-instruct"
