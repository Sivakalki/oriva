services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oriva
      POSTGRES_PASSWORD: oriva
      POSTGRES_DB: oriva
    ports:
      - "5432:5432"
    volumes:
      - oriva_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriva -d oriva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oriva_pg_data:
