# Local observability for the bake-off (docs/PLAN.md Phase 1 step 2).
#   make obs-up      # Prometheus :9090, Grafana :3000, Pushgateway :9091
# Prometheus scrapes the running ai-service (/metrics on the host :8090) and the
# pushgateway (bake-off runs pushed with `python -m oriva_ai.bakeoff --push`).

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  pushgateway:
    image: prom/pushgateway:v1.11.0
    ports: ["9091:9091"]

  grafana:
    image: grafana/grafana:11.5.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
