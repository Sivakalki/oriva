# Single config for the Oriva AI service. Committed with dev defaults only —
# no secrets. Override any value with env vars, e.g.
#   ORIVA_AI__LLM__MODEL=anthropic/claude-sonnet-5
#   ORIVA_AI__LOGGING__LEVEL=INFO
# Nested keys use "__" as the delimiter.

app:
  name: oriva-ai
  env: dev

logging:
  level: DEBUG
  format: console   # console | json

server:
  host: 0.0.0.0
  port: 8090

# Local transport for the bake-off — no telephony yet (docs/PLAN.md Phase 1).
transport:
  type: websocket

# STT / LLM / TTS are all pluggable and vendor-undecided (docs/ARCHITECTURE.md 3).
# The dev default is "mock" so the pipeline (and the test suite, which reads
# this file via Settings()) runs with no external services, models, or API
# keys. The bake-off flips these to whisper / litellm / piper etc.
# (a real-provider demo run used stt.provider=whisper, llm.provider=openai
# pointed at a local Ollama server, tts.provider=piper — see commit history).
stt:
  provider: mock
  # distil-medium.en: close to medium-tier accuracy at close to small-tier
  # speed. device: auto tries CUDA first (falls back to CPU if unavailable);
  # compute_type only applies on the CUDA path (CPU always forces plain
  # int8 -- see pipelines/providers/whisper/stt.py). Measured on this repo's
  # dev machine (RTX 3050 Ti, 4GB): distil-medium.en int8_float16 on CUDA
  # uses ~600MB VRAM, leaving room for the LLM's brief per-call load.
  model: distil-medium.en
  device: auto
  compute_type: int8_float16
  language: en
  mock_transcript: "I have about five years of backend experience."

llm:
  provider: mock
  model: openai/gpt-4o-mini
  base_url: http://localhost:4000
  api_key: not-needed-for-local-litellm
  mock_reply_template: "You said: {user} Can you tell me more about that?"

tts:
  provider: mock
  voice: en_US-lessac-medium

pipeline:
  greeting: "Hi, thanks for joining. Let's begin when you're ready."
  sample_rate: 16000
  vad: silero   # silero | none
  # How long the candidate must stay silent before their turn is considered
  # over. A plain timeout, not Pipecat's own default (a local ML "does this
  # sound complete" model) -- that model cut candidates off mid-sentence on
  # ordinary conversational pauses in live testing. Raise this if it's still
  # cutting people off; lower it if responses feel laggy.
  speech_timeout_secs: 1.2
  # Background context compaction (pipelines/context_compactor.py): summarize
  # the older half of the conversation once the live LLM context passes this
  # many words, keeping the most recent turns verbatim. 0 disables.
  context_compress_words: 800
  # Question-queue subsystem (pipelines/queue_interviewer.py): active
  # whenever mcp.enabled is true, in place of letting the live conversational
  # LLM decide question pacing/ordering/count itself.
  question_count: 5
  wrap_up_message: "That's everything I needed to ask. Thanks so much for your time today -- we'll follow up soon with next steps."
  default_duration_minutes: 30

# Go implements the MCP server; this is where Pipecat's MCPClient connects.
# Job description and resume are fetched directly (get_interview_plan), in
# full, and used as-is -- no retrieval/pgvector layer (both are short text,
# not a corpus worth indexing; see docs/ARCHITECTURE.md).
mcp:
  server_url: http://localhost:8080/mcp
  enabled: true
  auth_token: dev-mcp-token   # must match backend-go's mcp.auth_token

# backend-go origin, used to resolve a candidate join token -> session id on /ws.
backend:
  base_url: http://localhost:8080

metrics_enabled: true
