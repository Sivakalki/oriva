# Single config for the Oriva AI service. Committed with dev defaults only —
# no secrets. Override any value with env vars, e.g.
#   ORIVA_AI__LLM__MODEL=anthropic/claude-sonnet-5
#   ORIVA_AI__LOGGING__LEVEL=INFO
# Nested keys use "__" as the delimiter.

app:
  name: oriva-ai
  env: dev

logging:
  level: DEBUG
  format: console   # console | json

server:
  host: 0.0.0.0
  port: 8090

# Local transport for the bake-off — no telephony yet (docs/PLAN.md Phase 1).
transport:
  type: websocket

# STT / LLM / TTS are all pluggable and vendor-undecided (docs/ARCHITECTURE.md 3).
# The dev default is "mock" so the pipeline (and the test suite, which reads
# this file via Settings()) runs with no external services, models, or API
# keys. The bake-off flips these to whisper / litellm / piper etc.
# (a real-provider demo run used stt.provider=whisper, llm.provider=openai
# pointed at a local Ollama server, tts.provider=piper — see commit history).
stt:
  provider: mock
  model: base.en
  language: en
  mock_transcript: "I have about five years of backend experience."

llm:
  provider: mock
  model: openai/gpt-4o-mini
  base_url: http://localhost:4000
  api_key: not-needed-for-local-litellm
  mock_reply_template: "You said: {user} Can you tell me more about that?"

tts:
  provider: mock
  voice: en_US-lessac-medium

pipeline:
  greeting: "Hi, thanks for joining. Let's begin when you're ready."
  sample_rate: 16000
  vad: silero   # silero | none

# Python holds its own read-only connection for speculative pgvector retrieval
# only. All writes go through the Go MCP boundary (docs/ARCHITECTURE.md 2).
postgres:
  dsn: postgresql://oriva:oriva@localhost:5432/oriva
  readonly: true

# Go implements the MCP server; this is where Pipecat's MCPClient connects.
mcp:
  server_url: http://localhost:8080/mcp
  enabled: true
  auth_token: dev-mcp-token   # must match backend-go's mcp.auth_token

# backend-go origin, used to resolve a candidate join token -> session id on /ws.
backend:
  base_url: http://localhost:8080

metrics_enabled: true
