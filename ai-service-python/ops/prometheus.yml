global:
  scrape_interval: 5s

scrape_configs:
  # The running ai-service (/ws pipeline metrics), on the docker host.
  - job_name: oriva-ai
    static_configs:
      - targets: ["host.docker.internal:8090"]

  # backend-go (/metrics): request-duration histograms plus the scoring
  # metrics (oriva_turn_score, oriva_overall_score, oriva_scoring_*) --
  # scoring runs in Go (services/scoring), see docs/PLAN.md Phase 2.
  # Points at Victus (backend-go runs there now, not on this host) --
  # update this IP if Victus's address changes.
  - job_name: oriva-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["10.51.242.202:8080"]

  # Bake-off runs pushed via `python -m bakeoff --push`.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
