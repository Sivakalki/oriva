[project]
name = "oriva-ai"
version = "0.1.0"
description = "Oriva AI voice service — Pipecat STT -> LLM -> TTS pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[mcp,piper,silero,whisper]>=1.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.scripts]
oriva-ai = "main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat src/ layout (no oriva_ai wrapper package): every top-level dir under
# src/ becomes a top-level importable package (api, pipelines, transport,
# telemetry, bakeoff, harness); loose top-level modules are listed in
# `include`. The `sources` mapping below strips the "src/" prefix so
# `src/api/...` ships as `api/...`, importable as `import api`.
packages = ["src/api", "src/pipelines", "src/transport", "src/telemetry", "src/bakeoff", "src/harness"]
include = ["src/app.py", "src/main.py", "src/config.py", "src/log_setup.py"]
artifacts = ["src/**/*.yaml", "src/**/*.wav"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: talks to a running backend-go MCP server (needs ORIVA_GO_MCP_URL)",
]
addopts = "-m 'not integration'"
