[project]
name = "oriva-ai"
version = "0.1.0"
description = "Oriva AI voice service — Pipecat STT -> LLM -> TTS pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[mcp,piper,silero,whisper]>=1.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.scripts]
oriva-ai = "oriva_ai.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oriva_ai"]
artifacts = ["src/oriva_ai/**/*.yaml", "src/oriva_ai/**/*.wav"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: talks to a running backend-go MCP server (needs ORIVA_GO_MCP_URL)",
]
addopts = "-m 'not integration'"
