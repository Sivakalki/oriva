# Provider combinations to compare. Each is a full STT/LLM/TTS triple; fields
# not set fall back to the config.yaml defaults. Run with:
#   uv run python -m oriva_ai.bakeoff
#
# A combo whose provider needs an uninstalled extra is reported as "unavailable"
# and skipped — the rest of the matrix still runs.

combos:
  - name: all-mock
    stt: { provider: mock, model: base.en }
    llm: { provider: mock, model: mock }
    tts: { provider: mock, voice: mock }

  # Real TTS (Piper, fully local). STT/LLM stay mock so the TTS TTFA is measured
  # in isolation. Needs: uv add "pipecat-ai[piper]" (installed). The voice model
  # (~60MB) downloads to ~/.cache/oriva-ai/models on first use.
  - name: mock-stt-mock-llm-piper
    stt: { provider: mock, model: base.en }
    llm: { provider: mock, model: mock }
    tts: { provider: piper, voice: en_US-lessac-medium }

  - name: mock-stt-mock-llm-piper-low
    stt: { provider: mock, model: base.en }
    llm: { provider: mock, model: mock }
    tts: { provider: piper, voice: en_US-lessac-low }

  # --- combos still needing extras + a running LiteLLM proxy ---
